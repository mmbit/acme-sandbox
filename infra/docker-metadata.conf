# docker.service drop-in, installed by infra/harden.sh (and by cloud-init on first boot).
# Before: the rule is there before Docker starts any container. After: again, in case Docker rebuilt the chain.
[Service]
ExecStartPre=/usr/local/sbin/@SERVER_NAME@-block-metadata
ExecStartPost=/usr/local/sbin/@SERVER_NAME@-block-metadata
