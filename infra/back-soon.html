<!doctype html>
<!-- What Caddy shows when a page can't be served yet, mostly a deploy restarting its container (infra/Caddyfile,
     back_soon). No script and nothing from elsewhere, so every site's policy lets it run; it loads the page again every
     5 s. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<meta name="robots" content="noindex">
<title>Back in a moment</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.5 system-ui, sans-serif;
    background: #faf7f2; color: #3a3530; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #1d1b19; color: #e8e2da; } }
  main { padding: 2rem; max-width: 26rem; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 .5rem; }
  p { margin: 0; opacity: .75; }
  .dots span { display: inline-block; width: .5rem; height: .5rem; margin: 1.5rem .2rem 0; border-radius: 50%;
    background: currentColor; opacity: .3; animation: blink 1.4s infinite both; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 40% { opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { .dots span { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>Back in a moment</h1>
  <p>This page didn't answer just now, most likely because it's being updated. It tries again by itself every few seconds.</p>
  <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
</main>
</body>
</html>
