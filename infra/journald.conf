# The host journal, where every container logs (compose.yaml, products.py): kept at most 14 days whatever the traffic,
# the number the shops' privacy pages give for the web server's and the shops' logs, and at most 2 GB.
# journald deletes a rotated file once its first entry is past MaxRetentionSec, when files rotate (MaxFileSec, and its
# writers log every minute): an entry goes within 12 + 1 days, with a day to spare.
[Journal]
MaxRetentionSec=12day
MaxFileSec=1day
SystemMaxUse=2G
