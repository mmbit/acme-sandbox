# Which model and effort level each engine uses. The board changes this file.
# Per-agent overrides go in org.yaml (agents[].model, agents[].effort). When a new model ships, change it here and
# every agent (and every sub-agent they start) moves over on its next job.
claude:
  model: claude-opus-5-5     # full model id or an alias the Claude Code CLI accepts
  effort: high               # low | medium | high | xhigh | max
  autocompact: auto          # tokens (100000 to 1000000) at which a job's conversation is compacted, or auto: Claude Code's own
  # lighter: [claude-sonnet-5-5]   # models of choices below a small, fully specified job can run on (hq job --model),
  #                                # handing itself up to the agent's own model if it's bigger; none: no --model
  #
codex:
  model: null                # null = Codex's own default
  effort: high               # minimal | low | medium | high | xhigh
# The models the board picks from on an agent's page in HQ (Agents): its main model, which wins over the agent's
# engine and model here and in org.yaml, and one optional fallback its work moves to while the main model's seats are
# out or at their limit. Listed by the provider whose seats run them (anthropic, openai, mistral, google); HQ offers
# one once the board has a seat there.
choices:
  anthropic: { claude-opus-5-5: Opus 5.5, claude-sonnet-5-5: Sonnet 5.5 }
# The board's calls (platform/voice): low effort, because every second before the first word is heard on the line.
calls:
  model: claude-opus-5-5
  effort: low
