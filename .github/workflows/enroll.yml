name: Enroll device
# Gives the board a one-time link to add a device (passkey) to HQ. Only a hash of the code is committed.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  enroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          SERVER_NAME=$(sed -n 's/^SERVER_NAME=\([a-z0-9][a-z0-9-]*\)$/\1/p' company/infra.env | tail -1)
          [ -n "$SERVER_NAME" ] || { echo "::error::company/infra.env has no plain SERVER_NAME"; exit 1; }
          code=$(openssl rand -hex 16)
          expires=$(( $(date +%s) + 1800 ))
          for f in infra/enroll/*.sha256; do   # drop expired codes
            if [ -f "$f" ] && [ "$(basename "$f" .sha256)" -lt "$(date +%s)" ]; then git rm -q "$f"; fi
          done
          mkdir -p infra/enroll   # after the cleanup: git rm drops the folder once it's empty
          printf %s "$code" | sha256sum | cut -d' ' -f1 > "infra/enroll/$expires.sha256"
          git config user.name "$SERVER_NAME-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/enroll
          git commit -qm "Enroll a board device (one-time code, expires in 30 minutes)"
          # main moves often (merges, deploys): rebase onto it and try again rather than fail the run
          for try in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; [ $try = 5 ] && exit 1; sleep 3; done
          {
            echo "## Enroll a device"
            echo "Open this link **on the device you want to add**, within 30 minutes. Give the server a minute to pick it up first."
            echo
            echo "**https://$(cat infra/host)/enroll#$code**"
            echo
            echo "The link works once."
          } >> "$GITHUB_STEP_SUMMARY"
