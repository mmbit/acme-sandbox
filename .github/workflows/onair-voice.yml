# On Air's voice machine image (shared/onair/Dockerfile): built and published to GitHub's registry when it changes, so a
# company's `voice` run kind can name it by digest (shared/onair/README.md). The digest is in the run's summary.
name: On Air voice image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [shared/onair/Dockerfile, .github/workflows/onair-voice.yml]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # (PyTorch with CUDA and both models come to about 12 GB: the runner needs the room its preinstalled SDKs take)
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache && docker system prune -af
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: shared/onair
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/onair-voice:${{ github.sha }}
      - run: echo "Image ghcr.io/${{ github.repository_owner }}/onair-voice@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
